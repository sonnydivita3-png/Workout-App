name: Back up the database

# Free Supabase projects have no restorable backups. Once a week this dumps the data (not the schema, which is in
# supabase/migrations), encrypts it with a passphrase only you know, and keeps it as a workflow artifact for 90 days.
# The repo is public, so the file is always encrypted before upload. Setup: docs/social-setup.md, "Backups".
on:
  schedule:
    - cron: '43 8 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump and encrypt
        id: dump
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # Optional but easier: the database password on its own, so the URL can be pasted from Supabase unedited.
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASS" ]; then
            missing="$([ -z "$DB_URL" ] && echo 'SUPABASE_DB_URL ')$([ -z "$PASS" ] && echo 'BACKUP_PASSPHRASE')"
            # Scheduled runs skip quietly until backups are set up; a run started by hand says clearly what's missing.
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::Missing repository secret(s): $missing (Settings -> Secrets and variables -> Actions -> Secrets)."; exit 1
            fi
            echo "::notice::Database backups aren't set up yet (missing secrets: $missing)."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -n "$DB_PASSWORD" ]; then
            # Drop whatever is in the URL's password slot (e.g. "[YOUR-PASSWORD]") and pass the password separately,
            # which also avoids having to URL-encode special characters.
            DB_URL="$(printf '%s' "$DB_URL" | sed -E 's#^(postgres(ql)?://[^:/@]+):.*@#\1@#')"
            export PGPASSWORD="$DB_PASSWORD"
          fi
          # Non-secret details to help when the connection fails.
          echo "Connecting as $(printf '%s' "$DB_URL" | sed -E 's#^[a-z]+://([^:@/]+).*#\1#') to $(printf '%s' "$DB_URL" | sed -E 's#.*@([^/?]+).*#\1#')"
          case "$DB_URL" in *'['*|*']'*) echo "::warning::The connection string still contains [ or ]; remove the brackets around the password.";; esac
          set -o pipefail
          umask 077
          file="db-backup-$(date -u +%F).sql.gpg"
          docker run --rm -e DB_URL -e PGPASSWORD postgres:17 \
            pg_dump "$DB_URL" --data-only --no-owner --no-privileges -t 'public.*' -t auth.users -t auth.identities \
            | gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase-fd 3 -o "$file" 3<<<"$PASS"
          test -s "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          ls -l "$file"
      - if: steps.dump.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dump.outputs.file }}
          path: ${{ steps.dump.outputs.file }}
          retention-days: 90
          if-no-files-found: error
