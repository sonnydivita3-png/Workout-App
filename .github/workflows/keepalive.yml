name: Keep Supabase awake

# Free Supabase projects pause after about a week without traffic. This calls a tiny database function every
# three days so friends and backup keep working even when nobody opens the app.
on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        env:
          URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Supabase isn't configured; nothing to do."; exit 0; fi
          curl -fsS --retry 3 --retry-delay 10 -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}' -o /dev/null -w "HTTP %{http_code}\n"
