name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # The key ends up in the public JS bundle, so refuse anything but the publishable/anon key.
      - name: Check Supabase key is public
        env:
          KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          node -e '
            const k = process.env.KEY || ""
            if (k.startsWith("sb_secret_")) { console.error("::error::SUPABASE_ANON_KEY is a secret key. Use the publishable key (sb_publishable_...) and revoke this one."); process.exit(1) }
            const p = k.split(".")[1]
            let role
            try { role = p && JSON.parse(Buffer.from(p, "base64url").toString()).role } catch {}
            if (role && role !== "anon") { console.error("::error::SUPABASE_ANON_KEY is a " + role + " key. Use the anon/publishable key and rotate this one."); process.exit(1) }
          '
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Optional: set these repository variables to turn on real friends. Without them the app runs social in preview mode.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          # Optional: where "Send feedback" and bug reports go. Without it they open a GitHub issue instead.
          VITE_FEEDBACK_EMAIL: ${{ vars.FEEDBACK_EMAIL }}
          VITE_APP_VERSION: ${{ github.sha }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
